name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy committed run artifacts into the site
        # The site is static and reads the same JSON that is committed to the repo,
        # so the page can never disagree with the artifacts.
        run: |
          mkdir -p site/data
          cp artifacts/results.json site/data/results.json
          if [ -d artifacts/trajectories ]; then
            cp -r artifacts/trajectories site/data/trajectories
          fi
          ls -la site site/data

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
